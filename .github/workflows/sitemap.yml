name: Regenerate sitemap
on:
  schedule:
    - cron: '30 3 * * *'   # daily 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sitemap.xml + news-sitemap.xml
        # Kod .github/scripts/build_sitemap.py da — news lenta ish oqimi
        # ham har nashrdan keyin xuddi shu skriptni chaqiradi.
        run: python3 .github/scripts/build_sitemap.py

      - name: Sync the hardcoded counts on the homepage
        continue-on-error: true
        run: python3 tools/site/sync_counts.py

      - name: Rebuild /llms.txt
        continue-on-error: true
        run: python3 tools/site/build_llms.py

      - name: Commit if changed
        id: commit
        run: |
          # ignore lastmod-only churn on the two dynamic rows: compare URL sets too
          if git diff --quiet sitemap.xml news-sitemap.xml index.html llms.txt; then
            echo "sitemap unchanged"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git config user.name "Flarestamina-bot"
            git config user.email "actions@users.noreply.github.com"
            git add sitemap.xml news-sitemap.xml index.html llms.txt
            git commit -m "Auto-update sitemap, counts and llms.txt"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # Google ignores IndexNow, but Bing and Yandex act on it within minutes.
      # Yandex is worth the ping here — it has real share among students in
      # Uzbekistan, and a new post would otherwise sit until the next crawl.
      - name: Ping IndexNow
        if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        run: python3 tools/site/indexnow.py
