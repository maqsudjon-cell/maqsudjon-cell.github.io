name: News lenta

# IELTS va xorijda ta'lim xabarlarini yig'ib, o'zbekchada /news/lenta/ ga chiqaradi.
#
# JADVAL HAQIDA: GitHub cron'i kafolat bermaydi — o'lchandi, kuniga 8 tadan
# 2-3 tasi ishlaydi. Shuning uchun urinishlar soni oshirilgan. Ortiqcha
# yugurish arzon: yangi klaster bo'lmasa quvur LLM'ga umuman murojaat qilmaydi.
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      min_score:
        description: "Nashr chegarasi (past = ko'proq xabar, past sifat). Standart 30."
        required: false
        default: "30"
      max_per_run:
        description: "Bir yugurishda ko'pi bilan nechta xabar."
        required: false
        default: "5"
      dry_run:
        description: "Sinov rejimi: yozadi va quradi, lekin NASHR QILMAYDI."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-lenta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow (muqova rasmlari uchun)
        run: pip install --quiet pillow

      - name: Manbalarni yig'ish
        run: node newsbot/src/collect.mjs

      - name: Saralash va klasterlash
        env:
          MIN_SCORE: ${{ github.event.inputs.min_score || '30' }}
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '5' }}
        run: node newsbot/src/filter.mjs

      # Google News havolasini ochib, asl maqola matnini oladi. Busiz model
      # sarlavhadan boshqa hech narsa ko'rmaydi.
      - name: Asl maqolalarni o'qish
        continue-on-error: true
        run: node newsbot/src/enrich.mjs

      - name: O'zbekchada yozish
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node newsbot/src/write.mjs

      - name: Sahifalarni qurish
        run: node newsbot/src/build.mjs

      - name: Muqova rasmlari
        continue-on-error: true
        run: python3 newsbot/covers.py

      # Sitemap'ni shu yerda qayta quramiz, kunlik ish oqimini kutmasdan:
      # yangi xabar sitemap'ga va Google News sitemap'iga darhol tushsin.
      - name: Sitemap va news-sitemap
        continue-on-error: true
        run: python3 .github/scripts/build_sitemap.py

      - name: SEO tekshiruvi
        continue-on-error: true
        run: node newsbot/src/audit.mjs

      # Push rad etilishi mumkin: yugurish davomida boshqa ish oqimi
      # (community.yml, sitemap.yml) repozitoriyaga yozsa asosimiz eskiradi.
      - name: Nashr qilish
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "Flarestamina-bot"
          git config user.email "actions@users.noreply.github.com"

          # Faqat mavjud yo'llarni qo'shamiz: news/x hali yaratilmagan bo'lsa
          # `git add news/x` "pathspec did not match any files" deb yiqiladi va
          # butun yugurish qulaydi (2026-09-04 da shunday bo'ldi).
          # `cmd && ...` yozmang: qadam `bash -e` bilan ishlaydi va shart
          # bajarilmaganda butun yugurish to'xtaydi. Ochiq `if` xavfsiz.
          git_add_all() {
            local paths=()
            local x
            for x in newsbot/data news/x news/lenta news/lenta.json \
                     news/index.html sitemap.xml news-sitemap.xml; do
              if [ -e "$x" ]; then paths+=("$x"); fi
            done
            if [ ${#paths[@]} -gt 0 ]; then git add "${paths[@]}"; fi
            return 0
          }

          git_add_all
          if git diff --staged --quiet; then
            echo "Yangi xabar yo'q — commit qilinmadi."
            exit 0
          fi
          git commit -m "lenta: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            if git push; then echo "Nashr qilindi ($i-urinish)."; exit 0; fi
            echo "Push rad etildi — asosni yangilab qayta urinamiz ($i/3)."
            git pull --rebase -X theirs origin main || git rebase --abort
            # news/ generatsiya qilinadi: rebase'dan keyin yakuniy posts.json
            # dan qayta quramiz, aks holda sahifasi bor, lekin ro'yxatda yo'q
            # xabarlar paydo bo'ladi.
            node newsbot/src/build.mjs
            git_add_all
            git diff --staged --quiet || git commit --amend --no-edit
            sleep 5
          done
          echo "Uch urinishdan keyin ham push o'tmadi."
          exit 1

      # Sinov rejimida hech narsa nashr etilmaydi, shuning uchun natijani
      # faqat logdan ko'rish mumkin.
      - name: Sinov natijasi
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "SINOV REJIMI — nashr qilinmadi."
          if [ -s newsbot/data/posts.json ]; then
            node -e "
              const p = require('./newsbot/data/posts.json');
              console.log('Yozilgan xabarlar:', p.length);
              for (const x of p.slice(0, 5)) {
                console.log('---');
                console.log('sarlavha:', x.title, '(' + x.title.length + ' belgi)');
                console.log('kategoriya:', x.category, '| muhimlik:', x.importance, '| ball:', x.score);
                console.log('xulosa:', x.summary);
                for (const pt of x.points || []) console.log('  •', pt);
                console.log('manba:', x.source.name, x.source.url);
              }
            "
          fi

      # Google IndexNow'da qatnashmaydi, lekin Bing va Yandex bir necha
      # daqiqada javob beradi. Yandex O'zbekistondagi talabalar orasida
      # haqiqiy ulushga ega, shuning uchun bu ping arziydi.
      - name: Qidiruv tizimlariga bildirish (IndexNow)
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          URLS=$(node -e "
            const fs = require('fs');
            let r = { slugs: [] };
            try { r = JSON.parse(fs.readFileSync('newsbot/data/last-run.json', 'utf8')); } catch {}
            const u = (r.slugs || []).map(s => 'https://flarestamina.com/news/x/' + s + '/');
            if (u.length) u.push('https://flarestamina.com/news/lenta/', 'https://flarestamina.com/news/');
            console.log(u.join(' '));
          ")
          if [ -z "$URLS" ]; then echo "Yangi manzil yo'q — bildirilmadi."; exit 0; fi
          python3 tools/site/indexnow.py $URLS

      # Telegramga yuborish hozircha o'chirilgan (foydalanuvchi so'radi:
      # avval sayt ishlab tursin). Yoqish uchun quyidagi izohni oching —
      # newsbot/src/telegram.mjs va repo sekretlari tayyor turibdi.
      #
      # - name: Telegram kanalga yuborish
      #   continue-on-error: true
      #   env:
      #     TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      #     TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      #   run: node newsbot/src/telegram.mjs
