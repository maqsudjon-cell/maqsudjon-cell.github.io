<script>
(function () {
  try {
    var t = localStorage.getItem('fs-paper-theme') || localStorage.getItem('theme');
    if (t === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.dataset.theme = 'dark';
    } else {
      document.documentElement.dataset.theme = 'light';
    }
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff; --elev:#fff; --surface:#fff;
  --fg:#0a0a0a; --muted:#5c5c5c; --subtle:#8a8a8a;
  --border:color-mix(in oklab,var(--fg) 10%,transparent);
  --border-strong:color-mix(in oklab,var(--fg) 18%,transparent);
  --ok:#15803d;
  --rail:linear-gradient(90deg,#2dd4bf,#38bdf8 32%,#818cf8 64%,#e879f9 100%);
  --card:0 0 0 1px rgb(10 10 10 / .08), 0 1px 2px rgb(10 10 10 / .04);
  --card-hover:0 0 0 1px rgb(10 10 10 / .14), 0 10px 28px -18px rgb(10 10 10 / .2);
  --sans:Inter,ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html.dark,html[data-theme="dark"]{
  --bg:#000; --elev:#0a0a0a; --surface:#111;
  --fg:#f5f5f5; --muted:#8a8a8a; --subtle:#5c5c5c;
  --ok:#4ade80;
  --card:0 0 0 1px rgb(255 255 255 / .1);
  --card-hover:0 0 0 1px rgb(255 255 255 / .18);
  color-scheme:dark;
}
html{background:var(--bg);color:var(--fg)}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.bar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(14px)}
.bar-in{max-width:46rem;margin:0 auto;padding:0 1.2rem;height:3.75rem;display:flex;align-items:center;gap:.55rem}
.brand{display:flex;align-items:center;gap:.55rem;font-size:.9rem;font-weight:500;letter-spacing:-.01em}
.brand svg{width:1.55rem;height:1.55rem}
.sp{flex:1}
.lang{display:flex;height:2rem;border:1px solid var(--border);border-radius:999px;padding:2px;font-size:.7rem;font-weight:500}
.lang button{min-width:2rem;border-radius:999px;padding:0 .55rem;color:var(--muted)}
.lang button.on{background:var(--fg);color:var(--bg)}
.icon-btn{width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.icon-btn:hover{color:var(--fg)}
.link{font-size:.85rem;color:var(--muted);padding:0 .3rem}
.link:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.4rem;padding:0 1rem;border-radius:999px;font-size:.85rem;font-weight:500}
.btn.solid{background:var(--fg);color:var(--bg)}
.hi{font-size:.85rem;color:var(--muted);white-space:nowrap}

.wrap{max-width:46rem;margin:0 auto;padding:1.75rem 1.2rem 5rem}
.kicker{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--subtle);margin-bottom:.5rem}
h1{font-size:clamp(1.7rem,4.4vw,2.25rem);font-weight:500;letter-spacing:-.045em;line-height:1.1;margin-bottom:.45rem}
.lede{color:var(--muted);max-width:28rem;margin-bottom:1.4rem}

.cont{display:none;padding:1rem 1.15rem;border-radius:14px;background:var(--surface);box-shadow:var(--card);margin-bottom:1.15rem}
.cont.on{display:block}
.cont .lbl{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);margin-bottom:.28rem}
.cont a{font-weight:500;letter-spacing:-.02em}
.cont .st{display:block;margin-top:.2rem;font-size:.85rem;color:var(--muted)}

.premium{display:block;position:relative;border-radius:16px;padding:1.5px;margin-bottom:1.25rem;isolation:isolate}
.premium::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;
  background:linear-gradient(90deg,#2dd4bf,#38bdf8,#818cf8,#e879f9,#2dd4bf);
  background-size:300% 100%;
  animation:rail 3.6s linear infinite;
}
.premium-in{
  position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;
  background:var(--bg);border-radius:14.5px;padding:1.2rem 1.25rem 1.15rem;
}
.paid{
  display:inline-block;font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  background:var(--rail);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.4rem;
}
.premium b{display:block;font-size:1.2rem;font-weight:500;letter-spacing:-.03em}
.premium small{display:block;margin-top:.3rem;color:var(--muted);font-size:.85rem;max-width:22rem}
.premium .go{
  flex:none;display:inline-flex;align-items:center;height:2.5rem;padding:0 1.1rem;border-radius:999px;
  background:var(--fg);color:var(--bg);font-size:.85rem;font-weight:500;
}
@keyframes rail{to{background-position:300% 0}}

.skills{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin:0 0 1.15rem}
.sk{display:flex;flex-direction:column;min-height:8rem;padding:1.15rem 1.15rem 1.05rem;border-radius:14px;background:var(--surface);box-shadow:var(--card);text-align:left;transition:box-shadow .2s}
.sk:hover{box-shadow:var(--card-hover)}
.sk .ico{width:2.1rem;height:2.1rem;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);margin-bottom:.75rem;color:var(--fg)}
.sk b{font-weight:500;letter-spacing:-.03em;font-size:1.05rem}
.sk span{margin-top:.25rem;font-size:.78rem;color:var(--muted);line-height:1.4}
.sk em{margin-top:auto;padding-top:.85rem;font-style:normal;font-size:.85rem;font-weight:500}

.quiet{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.05rem 1.15rem;border-radius:14px;background:var(--surface);box-shadow:var(--card);margin-bottom:1.6rem}
.quiet:hover{box-shadow:var(--card-hover)}
.quiet b{display:block;font-weight:500;letter-spacing:-.02em}
.quiet small{display:block;margin-top:.15rem;color:var(--muted);font-size:.8rem}
.quiet .go{flex:none;font-size:.85rem;font-weight:500}

.tools p{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--subtle);margin-bottom:.35rem}
.tools a{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 0;border-top:1px solid var(--border);font-size:.95rem}
.tools a:first-of-type{border-top:0}
.tools a span{color:var(--subtle);font-size:.8rem;white-space:nowrap}

.back{display:inline-flex;align-items:center;gap:.35rem;margin-bottom:.9rem;font-size:.9rem;color:var(--muted)}
.back:hover{color:var(--fg)}
.search{display:flex;align-items:center;gap:.6rem;height:3rem;padding:0 1.05rem;border-radius:999px;background:var(--surface);box-shadow:var(--card);margin:0 0 1rem}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:1rem;color:var(--fg)}
.search input::placeholder{color:var(--subtle)}

.list{display:flex;flex-direction:column;gap:.55rem}
.row{display:flex;align-items:center;gap:.9rem;padding:.95rem 1.05rem;border-radius:14px;background:var(--surface);box-shadow:var(--card);min-height:4.6rem;transition:box-shadow .2s}
.row:hover{box-shadow:var(--card-hover)}
.row .txt{flex:1;min-width:0}
.row .ttl{font-weight:500;letter-spacing:-.02em;line-height:1.25}
.row .meta{margin-top:.18rem;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .done{display:block;margin-top:.18rem;font-family:var(--mono);font-size:.72rem;color:var(--ok)}
.row .go{flex:none;height:2.35rem;padding:0 .95rem;border-radius:999px;background:var(--fg);color:var(--bg);font-size:.82rem;font-weight:500}
.empty{display:none;text-align:center;padding:2.5rem 0;color:var(--muted)}

footer{border-top:1px solid var(--border)}
.foot{max-width:46rem;margin:0 auto;padding:1.35rem 1.2rem;display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;font-size:.75rem;color:var(--subtle)}
.foot a{color:var(--muted)}
.foot a:hover{color:var(--fg)}
.home-only,.skill-only{display:none}
body[data-view="home"] .home-only{display:block}
body[data-view="skill"] .skill-only{display:block}

@media(prefers-reduced-motion:reduce){
  .premium::before{animation:none;background:var(--rail)}
}
@media(max-width:420px){
  .link{display:none}
  .premium-in{padding:1.05rem 1.05rem 1rem}
}
</style>
</head>

<nav class="bar" aria-label="Site">

<script>
(function () {
  'use strict';
  var COPY = {
    en: {
      kicker:'Practice Hub', title:'Choose a skill', lede:'Sit the paper. See the band. No account to start.',
      results:'Results', signin:'Sign in', cont:'Continue', startHere:'Start here',
      all:'All skills', empty:'Nothing matches. Try another word.', home:'Home',
      start:'Start', tests:'tests', papers:'papers',
      listening:'Listening', reading:'Reading', writing:'Writing', speaking:'Speaking',
      listenMeta:'30 min · 40 questions', readMeta:'60 min · 40 questions',
      writeMeta:'60 min · 2 tasks', speakMeta:'14 min · 3 parts',
      cam:'Cambridge 21', camMeta:'The full book — four tests, all skills, free',
      mock:'Full Mock', mockMeta:'The complete exam. Listening, Reading and Writing in one sitting.',
      paid:'10 000 UZS', tools:'Tools', search:'Search this skill…',
      startStat:'the full book — 4 tests, all skills, free'
    },
    uz: {
      kicker:'Mashq', title:'Ko‘nikma tanlang', lede:'Testni yozing. Ballni ko‘ring. Boshlash uchun akkaunt shart emas.',
      results:'Natijalar', signin:'Kirish', cont:'Davom ettirish', startHere:'Shu yerdan boshlang',
      all:'Barcha ko‘nikmalar', empty:'Hech narsa topilmadi. Boshqa so‘z yozing.', home:'Bosh sahifa',
      start:'Boshlash', tests:'ta test', papers:'ta test',
      listening:'Listening', reading:'Reading', writing:'Writing', speaking:'Speaking',
      listenMeta:'30 daq · 40 savol', readMeta:'60 daq · 40 savol',
      writeMeta:'60 daq · 2 vazifa', speakMeta:'14 daq · 3 qism',
      cam:'Cambridge 21', camMeta:'To‘liq kitob — 4 ta test, barcha ko‘nikma, bepul',
      mock:'Full Mock', mockMeta:'To‘liq imtihon. Listening, Reading va Writing — bir o‘tirishda.',
      paid:'10 000 so‘m', tools:'Vositalar', search:'Shu ko‘nikma ichidan qidirish…',
      startStat:'to‘liq kitob — 4 ta test, bepul'
    }
  };
  var locale = 'en';
  try { var s = localStorage.getItem('fs-lang'); if (s === 'uz' || s === 'en') locale = s; } catch (e) {}
  function t() { return COPY[locale]; }
  function applyI18n() {
    document.documentElement.lang = locale;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var k = el.getAttribute('data-i18n');
      if (t()[k]) el.textContent = t()[k];
    });
    document.querySelectorAll('[data-lang]').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-lang') === locale);
    });
    var q = document.getElementById('q');
    if (q) q.placeholder = t().search;
  }
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.addEventListener('click', function () {
      locale = b.getAttribute('data-lang');
      try { localStorage.setItem('fs-lang', locale); } catch (e) {}
      applyI18n();
      paintHome();
      if (cat !== 'All') paintSkill();
    });
  });

  document.getElementById('yy').textContent = new Date().getFullYear();
  function syncThemeIco() {
    var dark = document.documentElement.classList.contains('dark') || document.documentElement.dataset.theme === 'dark';
    document.getElementById('ico-moon').style.display = dark ? 'none' : 'block';
    document.getElementById('ico-sun').style.display = dark ? 'block' : 'none';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#000000' : '#ffffff');
  }
  syncThemeIco();
  document.getElementById('tgl').addEventListener('click', function () {
    var dark = !(document.documentElement.classList.contains('dark') || document.documentElement.dataset.theme === 'dark');
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    try {
      localStorage.setItem('fs-paper-theme', dark ? 'dark' : 'light');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    } catch (e) {}
    syncThemeIco();
  });

  var user = null;
  if (window.FSAuth) {
    user = FSAuth.getUser();
    if (user && user.first_name) {
      var acct = document.getElementById('acct');
      acct.textContent = user.first_name;
      acct.className = 'hi';
    }
  }

  var hist = [];
  try { hist = JSON.parse(localStorage.getItem('p8_results') || '[]'); } catch (e) {}
  var doneByHref = {};
  hist.forEach(function (h) {
    if (h && h.href) doneByHref[h.href.replace(/[#?].*$/, '').replace(/\/$/, '')] = h.score;
  });
  function doneScore(url) {
    var u = url.replace(/[#?].*$/, '').replace(/\/$/, '');
    for (var k in doneByHref) {
      if (k.indexOf(u) === 0 || u.indexOf(k) === 0) return doneByHref[k];
    }
    return null;
  }

  var ICO = {
    listening:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 0 1 18 0"/><path d="M5 12v4a2 2 0 0 0 2 2h1v-6H5zm12 0v6h1a2 2 0 0 0 2-2v-4h-3z"/></svg>',
    reading:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    writing:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    speaking:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>'
  };

  var TESTS = [], cat = 'All', q = '';
  try { cat = new URLSearchParams(location.search).get('cat') || 'All'; } catch (e) {}

  function count(c) { return TESTS.filter(function (t) { return t.category === c; }).length; }
  function newestFirst(list) {
    return list.slice().sort(function (a, b) {
      var na = parseInt((a.title.match(/(\d+)/) || [0, 0])[1], 10);
      var nb = parseInt((b.title.match(/(\d+)/) || [0, 0])[1], 10);
      return nb - na;
    });
  }
  function findCat(c) { return TESTS.filter(function (t) { return t.category === c; }); }

  function setView(skill) {
    cat = skill || 'All';
    document.body.setAttribute('data-view', cat === 'All' ? 'home' : 'skill');
    try {
      history.replaceState(null, '', cat === 'All' ? location.pathname : '?cat=' + encodeURIComponent(cat));
    } catch (e) {}
    if (cat === 'All') {
      document.getElementById('title').textContent = t().title;
      document.getElementById('lede').textContent = t().lede;
      paintHome();
    } else {
      paintSkill();
    }
  }

  function paintHome() {
    var c = t();
    var mock = findCat('Full Mock')[0];
    document.getElementById('feat').innerHTML = mock
      ? '<a class="premium" href="'+mock.url+'"><span class="premium-in">'+
        '<span><span class="paid">'+c.paid+'</span><b>'+c.mock+'</b><small>'+c.mockMeta+'</small></span>'+
        '<span class="go">'+c.start+' →</span></span></a>'
      : '';

    var skills = [
      { key:'Listening', name:c.listening, meta:c.listenMeta, ico:ICO.listening },
      { key:'Reading', name:c.reading, meta:c.readMeta, ico:ICO.reading },
      { key:'Writing', name:c.writing, meta:c.writeMeta, ico:ICO.writing },
      { key:'Speaking', name:c.speaking, meta:c.speakMeta, ico:ICO.speaking }
    ];
    document.getElementById('skills').innerHTML = skills.map(function (s) {
      var n = count(s.key);
      return '<button type="button" class="sk" data-cat="'+s.key+'">'+
        '<span class="ico">'+s.ico+'</span><b>'+s.name+'</b>'+
        '<span>'+n+' '+c.papers+' · '+s.meta+'</span>'+
        '<em>'+c.start+' →</em></button>';
    }).join('');
    document.querySelectorAll('#skills [data-cat]').forEach(function (b) {
      b.addEventListener('click', function () { setView(b.getAttribute('data-cat')); });
    });

    var cam = findCat('Cambridge')[0];
    document.getElementById('cam').innerHTML = cam
      ? '<a class="quiet" href="'+cam.url+'"><span><b>'+c.cam+'</b><small>'+c.camMeta+'</small></span><span class="go">'+c.start+' →</span></a>'
      : '';

    var tools = findCat('Tools');
    document.getElementById('tools').innerHTML = tools.length
      ? '<p>'+c.tools+'</p>' + tools.map(function (x) {
          return '<a href="'+x.url+'"><b>'+x.title+'</b><span>→</span></a>';
        }).join('')
      : '';
  }

  function paintSkill() {
    var c = t();
    var n = count(cat);
    var names = { Listening:c.listening, Reading:c.reading, Writing:c.writing, Speaking:c.speaking };
    document.getElementById('title').textContent = (names[cat] || cat) + ' · ' + n + ' ' + c.tests;
    document.getElementById('lede').textContent = c.lede;
    var ql = q.trim().toLowerCase();
    var list = newestFirst(findCat(cat)).filter(function (x) {
      if (!ql) return true;
      return (x.title + ' ' + (x.description || '') + ' ' + (x.difficulty || '')).toLowerCase().indexOf(ql) !== -1;
    });
    var el = document.getElementById('list');
    el.innerHTML = list.map(function () {
      return '<a class="row" href="#"><div class="txt"><div class="ttl"></div><div class="meta"></div></div><span class="go">'+c.start+'</span></a>';
    }).join('');
    Array.prototype.forEach.call(el.children, function (row, i) {
      var x = list[i];
      row.href = x.url;
      row.querySelector('.ttl').textContent = x.title;
      row.querySelector('.meta').textContent = x.difficulty || x.description || '';
      var score = doneScore(x.url);
      if (score != null) {
        var d = document.createElement('span');
        d.className = 'done';
        d.textContent = '✓ ' + String(score);
        row.querySelector('.txt').appendChild(d);
      }
    });
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  }

  var deb = null;
  document.getElementById('q').addEventListener('input', function (e) {
    clearTimeout(deb);
    deb = setTimeout(function () { q = e.target.value; paintSkill(); }, 80);
  });
  document.getElementById('back').addEventListener('click', function (e) {
    e.preventDefault();
    q = '';
    document.getElementById('q').value = '';
    setView('All');
  });

  if (!hist.length) {
    document.getElementById('contLbl').textContent = t().startHere;
    var a0 = document.getElementById('contLink');
    a0.textContent = t().cam;
    a0.href = 'https://flarestamina.com/cambridge-21/';
    document.getElementById('contStat').textContent = t().startStat;
    document.getElementById('cont').classList.add('on');
  } else {
    var last = hist[hist.length - 1];
    var weekAgo = Date.now() - 7 * 864e5;
    var week = hist.filter(function (h) { return h.date && Date.parse(h.date) > weekAgo; }).length;
    var a = document.getElementById('contLink');
    a.textContent = last.test || 'last test';
    a.href = last.href || '#';
    document.getElementById('contStat').textContent =
      (last.score || '—') + ' · ' + week + (locale === 'uz' ? ' ta test shu hafta' : ' this week');
    document.getElementById('cont').classList.add('on');
  }


  applyI18n();
  fetch('tests.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      TESTS = d.tests || [];
      if (['Listening','Reading','Writing','Speaking'].indexOf(cat) === -1) cat = 'All';
      setView(cat);
    })
    .catch(function () {
      document.getElementById('title').textContent = 'Could not load tests';
    });
})();
</script>
<script data-goatcounter="https://flarestamina.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
