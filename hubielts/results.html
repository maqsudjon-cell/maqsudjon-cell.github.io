<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Results — Flarestamina</title>
<meta name="description" content="Your IELTS practice history: streak, weekly activity and every saved score.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<script>
(function () {
  try {
    var t = localStorage.getItem('fs-paper-theme') || localStorage.getItem('theme');
    if (t === 'dark') {
      document.documentElement.classList.add('dark');
      document.documentElement.dataset.theme = 'dark';
    } else {
      document.documentElement.dataset.theme = 'light';
    }
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff; --elev:#ffffff; --surface:#ffffff;
  --fg:#0a0a0a; --muted:#5c5c5c; --subtle:#8a8a8a;
  --border: color-mix(in oklab, var(--fg) 10%, transparent);
  --border-strong: color-mix(in oklab, var(--fg) 18%, transparent);
  --ok:#15803d;
  --card: 0 0 0 1px rgb(10 10 10 / 0.08), 0 1px 2px rgb(10 10 10 / 0.04);
  --sans: Inter, ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
html.dark, html[data-theme="dark"]{
  --bg:#000; --elev:#0a0a0a; --surface:#111;
  --fg:#f5f5f5; --muted:#8a8a8a; --subtle:#5c5c5c;
  --ok:#4ade80;
  --card: 0 0 0 1px rgb(255 255 255 / 0.1);
  color-scheme: dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

.bar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--bg) 85%, transparent);backdrop-filter:blur(12px)}
.bar-in{max-width:56rem;margin:0 auto;padding:0 1.25rem;height:4rem;display:flex;align-items:center;gap:.75rem}
.brand{display:flex;align-items:center;gap:.65rem;font-size:.875rem;font-weight:500}
.brand svg{width:1.75rem;height:1.75rem}
.nav-sp{flex:1}
.icon-btn{width:2.75rem;height:2.75rem;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;height:2.5rem;padding:0 1rem;border-radius:999px;font-size:.875rem;font-weight:500;border:1px solid var(--border-strong)}
.hi{font-size:.875rem;color:var(--muted)}
.hi b{color:var(--fg);font-weight:500}

.wrap{max-width:56rem;margin:0 auto;padding:2rem 1.25rem 4.5rem}
.kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--subtle);margin-bottom:.6rem}
h1{font-size:clamp(1.75rem,4vw,2.25rem);font-weight:500;letter-spacing:-.04em;margin-bottom:.4rem}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:1.75rem}
.sub .ok{color:var(--ok)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:2rem}
@media(max-width:640px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--surface);border-radius:10px;padding:1rem 1.1rem;box-shadow:var(--card)}
.tile .lb{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);margin-bottom:.35rem}
.tile .v{font-size:1.75rem;font-weight:500;letter-spacing:-.04em}
.tile .v small{font-size:.75rem;color:var(--muted);font-weight:400}

.sec{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--subtle);margin:1.75rem 0 .75rem}
.chart{display:flex;align-items:flex-end;gap:3px;height:74px;border-radius:10px;padding:12px 14px 10px;background:var(--surface);box-shadow:var(--card)}
.chart i{flex:1;background:var(--border);border-radius:2px 2px 0 0;min-height:3px}
.chart i.on{background:var(--fg)}
.chart-lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.65rem;color:var(--subtle);margin-top:.4rem}

.hist{border-radius:10px;overflow:hidden;box-shadow:var(--card);background:var(--surface)}
.row{display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:.9rem}
.row:last-child{border-bottom:none}
.row .d{font-family:var(--mono);font-size:.7rem;color:var(--subtle);min-width:86px}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-family:var(--mono);font-weight:500;color:var(--ok);white-space:nowrap}
.row .cloud{font-size:10px;color:var(--subtle)}
.none{padding:2rem 1rem;color:var(--muted);text-align:center}

footer{border-top:1px solid var(--border)}
.foot{max-width:56rem;margin:0 auto;padding:1.5rem 1.25rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--subtle)}
.foot a{color:var(--muted)}
.foot a:hover{color:var(--fg)}
</style>
</head>
<body>

<nav class="bar" aria-label="Site">
  <div class="bar-in">
    <a class="brand" href="./" aria-label="Back to the hub">
      <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <path d="M16 1.4 L17.85 13.55 L30.6 16 L17.85 18.45 L16 30.6 L14.15 18.45 L1.4 16 L14.15 13.55 Z"/>
      </svg>
      Flarestamina
    </a>
    <div class="nav-sp"></div>
    <a class="btn" href="./">Tests</a>
    <a class="btn" id="acct" href="https://flarestamina.com/account/?return=https%3A%2F%2Fflarestamina.com%2Fielts-hub%2Fresults.html">Sign in</a>
    <button class="icon-btn" id="tgl" aria-label="Toggle theme">◐</button>
  </div>
</nav>

<main class="wrap">
  <p class="kicker">Results</p>
  <h1 id="head">Your progress</h1>
  <p class="sub" id="syncline">Scores on this device. Sign in to sync across phones.</p>

  <div class="tiles">
    <div class="tile"><div class="lb">Total tests</div><div class="v" id="vTotal">—</div></div>
    <div class="tile"><div class="lb">This week</div><div class="v" id="vWeek">—</div></div>
    <div class="tile"><div class="lb">Streak</div><div class="v" id="vStreak">—<small> days</small></div></div>
    <div class="tile"><div class="lb">Best (of 40)</div><div class="v" id="vBest">—</div></div>
  </div>

  <p class="sec">Last 30 days</p>
  <div class="chart" id="chart" aria-label="Practice activity, last 30 days"></div>
  <div class="chart-lbl"><span id="d30"></span><span>today</span></div>

  <p class="sec">History</p>
  <div class="hist" id="hist"><div class="none">loading…</div></div>
</main>

<footer>
  <div class="foot">
    <span>© <span id="yy"></span> Flarestamina</span>
    <span><a href="./">← back to tests</a> · <a href="https://t.me/flarestamina" target="_blank" rel="noopener">Telegram</a></span>
  </div>
</footer>

<script src="https://flarestamina.com/assets/fs-auth.js"></script>
<script>
(function () {
  'use strict';
  document.getElementById('yy').textContent = new Date().getFullYear();
  document.getElementById('tgl').addEventListener('click', function () {
    var dark = !(document.documentElement.classList.contains('dark') || document.documentElement.dataset.theme === 'dark');
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    try {
      localStorage.setItem('fs-paper-theme', dark ? 'dark' : 'light');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    } catch (e) {}
  });

  var user = null;
  if (window.FSAuth) {
    user = FSAuth.getUser();
    if (user && user.first_name) {
      var acct = document.getElementById('acct');
      acct.className = 'hi';
      acct.innerHTML = 'hi, <b></b>';
      acct.querySelector('b').textContent = user.first_name;
    }
  }
  document.getElementById('head').textContent = user ? (user.first_name + "’s progress") : 'Your progress';

  var FS_PROJECT = 'ieltshub-e2aa8';

  function localResults() {
    try {
      return (JSON.parse(localStorage.getItem('p8_results') || '[]')).map(function (h) {
        return { test: h.test || '', score: h.score, href: h.href || '', date: h.date, cloud: false };
      });
    } catch (e) { return []; }
  }

  function cloudResults(phone) {
    if (!phone) return Promise.resolve([]);
    var tokenP = (window.FSAuth && FSAuth.getFreshToken) ? FSAuth.getFreshToken() : Promise.resolve(null);
    return tokenP.then(function (token) {
      var headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      return fetch('https://firestore.googleapis.com/v1/projects/' + FS_PROJECT + '/databases/(default)/documents:runQuery', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
        structuredQuery: {
          from: [{ collectionId: 'results' }],
          where: { fieldFilter: { field: { fieldPath: 'phone' }, op: 'EQUAL', value: { stringValue: phone } } },
          limit: 500
        }
      })
    }).then(function (r) { return r.json(); }).then(function (rows) {
      return (rows || []).filter(function (r) { return r.document; }).map(function (r) {
        var f = r.document.fields || {};
        return {
          test: (f.test && f.test.stringValue) || '',
          score: f.score ? (f.score.integerValue != null ? f.score.integerValue : f.score.doubleValue) : '',
          href: '',
          date: (f.ts && f.ts.timestampValue) || r.document.createTime,
          cloud: true
        };
      });
    });
    }).catch(function () { return null; });
  }

  function key(r) {
    return r.test + '|' + r.score + '|' + String(r.date || '').slice(0, 16);
  }

  function render(items, cloudState) {
    items = items.filter(function (r) { return r.date; });
    items.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });

    var now = new Date();
    var weekAgo = now.getTime() - 7 * 864e5;

    document.getElementById('vTotal').textContent = items.length;
    document.getElementById('vWeek').textContent = items.filter(function (r) { return new Date(r.date) > weekAgo; }).length;

    var days = {};
    items.forEach(function (r) {
      var d = new Date(r.date);
      var k = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      days[k] = (days[k] || 0) + 1;
    });
    function dayKey(offset) {
      var d = new Date(now.getTime() - offset * 864e5);
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    var streak = 0, start = days[dayKey(0)] ? 0 : 1;
    for (var i = start; days[dayKey(i)]; i++) streak++;
    var streakEl = document.getElementById('vStreak');
    streakEl.innerHTML = '';
    streakEl.append(String(streak));
    var sm = document.createElement('small'); sm.textContent = ' days'; streakEl.appendChild(sm);

    var best = null;
    items.forEach(function (r) {
      var m = String(r.score).match(/^(\d+)\s*(?:\/\s*40)?$/);
      if (m) { var n = +m[1]; if (n <= 40 && (best === null || n > best)) best = n; }
    });
    document.getElementById('vBest').textContent = best === null ? '—' : best;

    var chart = document.getElementById('chart');
    chart.innerHTML = '';
    var max = 1;
    var counts = [];
    for (var d = 29; d >= 0; d--) { var c = days[dayKey(d)] || 0; counts.push(c); if (c > max) max = c; }
    counts.forEach(function (c) {
      var b = document.createElement('i');
      if (c) { b.className = 'on'; b.style.height = Math.max(12, Math.round(c / max * 100)) + '%'; }
      chart.appendChild(b);
    });
    var d30 = new Date(now.getTime() - 29 * 864e5);
    document.getElementById('d30').textContent = d30.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });

    var hist = document.getElementById('hist');
    hist.innerHTML = '';
    if (!items.length) {
      hist.innerHTML = '<div class="none">No results yet — finish any test and it appears here.</div>';
    } else {
      items.slice(-60).reverse().forEach(function (r) {
        var row = document.createElement(r.href ? 'a' : 'div');
        row.className = 'row';
        if (r.href) row.href = r.href;
        var d = new Date(r.date);
        row.innerHTML = '<span class="d"></span><span class="t"></span>' + (r.cloud ? '<span class="cloud">☁</span>' : '') + '<span class="s"></span>';
        row.querySelector('.d').textContent = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        row.querySelector('.t').textContent = r.test || 'Test';
        row.querySelector('.s').textContent = r.score !== '' && r.score != null ? '✓ ' + r.score : '';
        hist.appendChild(row);
      });
    }

    var syncline = document.getElementById('syncline');
    if (!user) {
      syncline.textContent = 'On this device. Sign in to keep scores across phones.';
    } else if (cloudState === null) {
      syncline.textContent = 'Showing this device only — cloud not reachable.';
    } else {
      syncline.innerHTML = '<span class="ok">Synced</span> — same history on every device (' + cloudState + ' cloud records).';
    }
  }

  var local = localResults();
  render(local, 0);
  cloudResults(user ? user.phone : '').then(function (cloud) {
    if (cloud === null) { render(local, null); return; }
    var seen = {}, merged = [];
    local.concat(cloud).forEach(function (r) {
      var k = key(r);
      if (seen[k]) return;
      seen[k] = 1;
      merged.push(r);
    });
    render(merged, cloud.length);
  });
})();
</script>
<script data-goatcounter="https://flarestamina.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
