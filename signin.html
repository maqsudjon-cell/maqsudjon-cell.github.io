<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Flarestamina</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://flarestamina.com/account/">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
/* This page used to run a second, separate sign-in (email + Google, Firebase
   web SDK). FS Account — phone + password, /assets/fs-auth.js — is the one the
   rest of the site reads, so a session created here was not recognised
   anywhere else. Nothing links here any more; it stays only for old bookmarks
   and forwards the ?next= target to FS Account's ?return=. */
(function () {
  var to = 'https://flarestamina.com/account/';
  try {
    var next = new URLSearchParams(location.search).get('next');
    if (next) {
      var u = new URL(next, location.origin);
      if (/(^|\.)flarestamina\.com$|(^|\.)pangea8\.com$/.test(u.hostname)) {
        to += '?return=' + encodeURIComponent(u.href);
      }
    }
  } catch (e) {}
  location.replace(to);
})();
</script>
<meta http-equiv="refresh" content="0; url=/account/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#0a0a0a;font:15px/1.6 Inter,system-ui,sans-serif;text-align:center;padding:1.5rem}a{color:inherit}@media(prefers-color-scheme:dark){body{background:#000;color:#f5f5f5}}</style>
</head>
<body><p>Sign-in moved to <a href="/account/">FS Account</a>.</p></body>
</html>
